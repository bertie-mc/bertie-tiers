modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Slag n' Embers is only referenced through generic data-component IDs in the config
# file, never through its Java API, so it stays fully optional. AFTER ordering keeps
# our harvest verdict applied on top of an already-registered Slag component set.
[[dependencies.${mod_id}]]
modId="slag"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
